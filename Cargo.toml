[package]
name = "conductor"
version = "0.103.0"
edition = "2024"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
git2 = { version = "0.20", features = ["vendored-openssl"] }
rusqlite = { version = "0.39", features = ["bundled"] }
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
syntect-tui = "3.0.6"
similar = { version = "2", features = ["inline"] }
toml = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
portable-pty = "0.9"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
dirs = "6"
copypasta = "0.10"
log = "0.4"
env_logger = "0.11"
notify = "8"
unicode-segmentation = "1"
unicode-width = "0.2"
vt100 = "0.15"
open = "5"
regex = "1"
ignore = "0.4"
aa-media = { git = "https://github.com/S-Nakamur-a/aa-media.git", rev = "a54ac2b" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-go = "0.25"
tree-sitter-typescript = "0.23"
# レビュー成果物 (<worktree>/.revidere/review.json) の型と読む順。ホストが
# 埋め込むのはこのクレートだけで、解析 (AI 呼び出し) は revidere の CLI 側にある。
#
# revidere がまだ公開されていないので path 参照。相対ではなく絶対にしてあるのは、
# worktree が <repo-parent>/conductor-worktrees/<ブランチ名>/ に作られ、ブランチ名に
# 含まれる / の数だけ深さが変わるため。本体と worktree の両方から同じ 1 行で届く
# 書き方が他に無い。公開されたら次の 1 行に差し替える:
#   revidere = { git = "https://github.com/S-Nakamur-a/revidere", package = "revidere" }
revidere = { path = "/Users/shunnaka/ghq/github.com/S-Nakamur-a/revidere/crates/revidere" }
libc = "0.2"
# 1つのインポートで済むファサード (keymap-core + keymap-config + keymap-seq)。
# crossterm フィーチャーで KeyInput::try_from(KeyEvent) が使えるようになる。
# 0.1.2 では、このアプリが依存する宣言的レイヤー — actions! マクロと ActionName
# トレイト — が、0.1.1 の merge (デフォルトとユーザー設定を統合、= false で
# 無効化するトゥームストーン方式) と keys_for_action の探索ヘルパーに追加された。
keymap-suite = { version = "0.1.2", features = ["crossterm"] }
# conductor mcp-serve — ヘッドレスのウォークスルーセッションが話しかける stdio の
# MCP サーバ。別パッケージにせずバイナリへ埋め込んである理由は src/mcp_serve/mod.rs
# のモジュール doc を参照。schemars はツール引数の構造体に付けた
# #[derive(JsonSchema)] を支える。tokio は reqwest → hyper 経由で既に依存木に
# 入っているので、新たに要るのは rmcp の stdio トランスポートが必要とするフィーチャー
# だけ。current-thread ランタイムで十分 — サーバは 1 本のパイプで 1 クライアントだけを
# 相手にする。
rmcp = { version = "3.0.1", features = ["server", "macros", "transport-io"] }
schemars = "1"
tokio = { version = "1", features = ["rt", "io-std", "time"] }

[profile.dev]
debug = "limited"

[profile.dev.package."*"]
opt-level = 2

[dev-dependencies]
tempfile = "3"
