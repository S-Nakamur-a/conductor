[package]
name = "conductor-core"
version = "0.1.0"
edition = "2024"
publish = false
description = "conductor のドメイン層。UI も副作用の実行者 (svc) も知らない"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
anyhow = "1"
log = "0.4"
unicode-segmentation = "1"
unicode-width = "0.2"
keymap-suite = { version = "0.1.2", features = ["crossterm"] }
git2 = { version = "0.20", features = ["vendored-openssl"] }
rusqlite = { version = "0.40", features = ["bundled"] }
similar = { version = "3", features = ["inline"] }
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
dirs = "6"
ignore = "0.4"
sheaf-core = { path = "../sheaf-core" }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
libc = "0.2"
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-go = "0.25"
tree-sitter-typescript = "0.23"

[dev-dependencies]
tempfile = "3"
scip = "0.9"
protobuf = "3.7"
