[package]
name = "conductor-mcp"
version = "0.1.0"
edition = "2024"
publish = false
description = "conductor mcp-serve: レビュー DB を stdio の MCP で公開するサーバ"

[dependencies]
conductor-core = { path = "../conductor-core" }
rmcp = { version = "3.0.1", features = ["server", "macros", "transport-io"] }
schemars = "1"
tokio = { version = "1", features = ["rt", "io-std", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
git2 = { version = "0.20", features = ["vendored-openssl"] }
# refresh.pipe (FIFO) を O_NONBLOCK で開いて突くため。
libc = "0.2"

[dev-dependencies]
tempfile = "3"
