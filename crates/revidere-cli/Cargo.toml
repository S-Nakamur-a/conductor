[package]
name = "revidere-cli"
version = "0.2.0"
edition = "2021"
publish = false
description = "Turns a git diff into a reviewed artifact by way of an external AI command"

# conductor 本体が `conductor revidere ...` として同じ実装を呼ぶので、
# 中身はライブラリ側にある。bin はそれを呼ぶだけの入口。
[lib]
name = "revidere_cli"
path = "src/lib.rs"

[[bin]]
name = "revidere"
path = "src/main.rs"

[dependencies]
revidere = { path = "../revidere" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
