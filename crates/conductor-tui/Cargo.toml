[package]
name = "conductor-tui"
version = "0.1.0"
edition = "2024"
publish = false
description = "conductor の画面。パネル群とシェル (route / layout / Effect / render)"

[[bin]]
name = "conductor-next"
path = "src/main.rs"

[dependencies]
conductor-core = { path = "../conductor-core" }
conductor-svc = { path = "../conductor-svc" }
# conductor-next mcp-serve。旧 main と同じく別バイナリにせず埋め込む。
conductor-mcp = { path = "../conductor-mcp" }
ratatui = "0.29"
crossterm = "0.28"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
unicode-width = "0.2"
# PTY 画面の読み出し。PtyStore が渡す Parser を描画時に直接ロックする。
vt100 = "0.15"
# panic ログの置き場と時刻。
dirs = "6"
chrono = "0.4"
# Viewer の構文ハイライト。
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
syntect-tui = "3.0.6"
# 折りたたみ範囲の算出。
tree-sitter = "0.26"
# 変更ファイル一覧の色分けが status のビットを直接読む。
git2 = { version = "0.20", features = ["vendored-openssl"] }

[dev-dependencies]
tempfile = "3"
toml = "1"
