[package]
name = "revidere"
version = "0.5.0"
edition = "2021"
publish = false
description = "Reading order and coverage checking for AI-assisted git diff review"

# ホストは TUI なので、直接 stdout/stderr へ書くと画面が壊れる。進捗は log だけ。
[dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
revidere-fixtures = { path = "../revidere-fixtures" }
