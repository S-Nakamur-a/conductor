name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # worktree を分けるための -wt.<名前> は手元だけのもの。戻し忘れると、
      # その版を名乗る成果物が main に載る (make wt-reset)。
      - name: No worktree version stamp
        run: |
          if grep -n '^version = .*-wt\.' crates/*/Cargo.toml; then
            echo "::error::make wt-reset を実行してから push してください"
            exit 1
          fi

      # fmt を先に置くのはビルドが要らず、失敗したときに clippy を待たせないため。
      - name: Format
        run: cargo fmt --all -- --check

      # 保存を main に限るのは、PR ブランチごとのキャッシュがリポジトリの容量枠を
      # 食い合うため。PR は main が保存したものを読めば足りる。
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings
