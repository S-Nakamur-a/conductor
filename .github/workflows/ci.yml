name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # fmt と構造判定を先に置くのはビルドが要らず、失敗したときに clippy を待たせないため。
      - name: Format
        run: cargo fmt --all -- --check

      - name: Structure
        run: ./scripts/check-structure.sh closure

      # 保存を main に限るのは、PR ブランチごとのキャッシュがリポジトリの容量枠を
      # 食い合うため。PR は main が保存したものを読めば足りる。
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings
